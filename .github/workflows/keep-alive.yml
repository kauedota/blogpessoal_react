name: Keep Render API awake

on:
  schedule:
    # A cada 10 minutos (o Render free dorme após ~15 min sem requisições)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping da API
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://blogpessoal-7t26.onrender.com/ --max-time 60
